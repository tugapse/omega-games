<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Omega Terreno</title>
  <style>
    :root { color-scheme: dark; --fg: #f6f1ff; --panel: rgba(12, 9, 24, .78); --line: #3b3352; --cyan: #2de2ff; --gold: #ffd23f; }
    html, body { margin: 0; height: 100%; background: #9cc4e4; color: var(--fg); font: 14px/1.4 system-ui, sans-serif; overflow: hidden; -webkit-tap-highlight-color: transparent; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    #stats { position: fixed; right: 8px; top: max(8px, env(safe-area-inset-top)); padding: 3px 8px; background: var(--panel); border-radius: 8px; font: 12px monospace; pointer-events: none; }
    button { font: inherit; color: inherit; cursor: pointer; }
    .bar { position: fixed; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; padding: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; max-width: calc(100vw - 32px); overflow-x: auto; scrollbar-width: none; }
    .bar::-webkit-scrollbar { display: none; }
    #tools { bottom: max(10px, env(safe-area-inset-bottom)); }
    #options { bottom: calc(max(10px, env(safe-area-inset-bottom)) + 62px); align-items: center; flex-wrap: wrap; justify-content: center; }
    .bar button { flex: none; min-width: 52px; padding: 7px 10px; border: 1px solid transparent; border-radius: 10px; background: transparent; font-size: 12px; line-height: 1.15; }
    .bar button .i { display: block; font-size: 18px; }
    .bar button.on { border-color: var(--cyan); background: rgba(45, 226, 255, .15); }
    .bar button:disabled { opacity: .35; }
    .bar label { display: flex; align-items: center; gap: 6px; font-size: 12px; white-space: nowrap; padding: 0 4px; }
    .bar input[type=range] { width: 90px; accent-color: var(--cyan); }
    .layer { width: 34px; height: 34px; min-width: 0 !important; padding: 0 !important; border-radius: 50% !important; background-size: cover !important; border: 2px solid transparent !important; }
    .layer.on { border-color: var(--gold) !important; }
    #top { position: fixed; left: 8px; top: max(8px, env(safe-area-inset-top)); display: flex; gap: 6px; flex-wrap: wrap; max-width: calc(100vw - 100px); }
    #top button { padding: 6px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; font-size: 12px; }
    #top button.on { border-color: var(--cyan); background: rgba(45, 226, 255, .25); }
    #menu { position: fixed; right: 8px; top: calc(max(8px, env(safe-area-inset-top)) + 40px); display: none; flex-direction: column; gap: 4px; padding: 6px; min-width: 190px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; z-index: 4; }
    #menu.open { display: flex; }
    #menu button { text-align: left; padding: 8px 10px; background: transparent; border: 0; border-radius: 8px; font-size: 13px; }
    #menu button:hover { background: rgba(255, 255, 255, .08); }
    #menu hr { width: 100%; border: 0; border-top: 1px solid var(--line); margin: 2px 0; }
    #saved { padding: 2px 10px 4px; font-size: 11px; opacity: .7; }
    #stamps button { min-width: 0; padding: 6px 9px; }
    body.walking #tools, body.walking #options > :not(#waterBox), body.walking #undo, body.walking #redo, body.walking #home { display: none !important; }
    #hint { position: fixed; left: 50%; top: calc(max(8px, env(safe-area-inset-top)) + 46px); transform: translateX(-50%); padding: 5px 12px; background: var(--panel); border-radius: 10px; font-size: 12px; pointer-events: none; transition: opacity .4s; text-align: center; max-width: calc(100vw - 32px); }
    @media (max-width: 520px) { .bar input[type=range] { width: 70px; } #hint, #menu { top: calc(max(8px, env(safe-area-inset-top)) + 84px); } }
    #overlay { pointer-events: none; }
    #diag { position: fixed; left: 8px; right: 8px; top: calc(max(8px, env(safe-area-inset-top)) + 140px); max-height: 45vh; overflow: auto; padding: 8px 10px; background: rgba(40, 6, 12, .9); border: 1px solid #ff3ea5; border-radius: 10px; font: 11px/1.35 monospace; white-space: pre-wrap; display: none; z-index: 5; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <canvas id="overlay"></canvas>
  <div id="stats"></div>
  <div id="diag"></div>
  <div id="top">
    <button id="home">⌖ Centrar</button>
    <button id="undo">↶ Anular</button>
    <button id="redo">↷ Refazer</button>
    <button id="balls">● Bolas</button>
    <button id="water">💧 Água</button>
    <button id="walk">🚶 Andar</button>
    <button id="more">☰</button>
  </div>
  <div id="menu">
    <button id="save">Guardar agora</button>
    <button id="export">Exportar ficheiro…</button>
    <button id="import">Abrir ficheiro…</button>
    <div id="saved">Guarda-se sozinho neste browser</div>
    <hr>
    <button id="bake">Aplicar regras à pintura</button>
    <button id="clear">Limpar pintura</button>
    <button id="regen">Novo relevo</button>
  </div>
  <input id="file" type="file" accept=".terreno,application/gzip" hidden>
  <div id="hint">Arrasta para rodar · Shift+arrastar ou dois dedos movem · toque duplo centra</div>
  <div id="options" class="bar">
    <span id="layers" style="display:flex;gap:6px"></span>
    <span id="stamps" style="display:none;gap:4px"></span>
    <label id="stepBox" style="display:none">Degrau <input id="step" type="range" min="2" max="20" value="6"></label>
    <label>Tamanho <input id="radius" type="range" min="2" max="60" value="14"></label>
    <label>Força <input id="strength" type="range" min="5" max="100" value="50"></label>
    <label>Dureza <input id="hardness" type="range" min="0" max="95" value="35"></label>
    <label id="waterBox" style="display:none">💧 Nível <input id="level" type="range" min="-40" max="120" value="0"></label>
  </div>
  <div id="tools" class="bar">
    <button data-tool="view" class="on"><span class="i">✥</span>Ver</button>
    <button data-tool="raise"><span class="i">▲</span>Subir</button>
    <button data-tool="lower"><span class="i">▼</span>Baixar</button>
    <button data-tool="smooth"><span class="i">≈</span>Alisar</button>
    <button data-tool="flatten"><span class="i">▬</span>Aplanar</button>
    <button data-tool="ramp"><span class="i">◢</span>Rampa</button>
    <button data-tool="noise"><span class="i">⁂</span>Ruído</button>
    <button data-tool="terrace"><span class="i">≣</span>Socalcos</button>
    <button data-tool="stamp"><span class="i">◉</span>Carimbo</button>
    <button data-tool="erode"><span class="i">☂</span>Erosão</button>
    <button data-tool="grow"><span class="i">⊞</span>Aumentar</button>
    <button data-tool="paint"><span class="i">✎</span>Pintar</button>
    <button data-tool="erase"><span class="i">⌫</span>Apagar</button>
  </div>
  <script type="module" src="game.js"></script>
</body>
</html>
